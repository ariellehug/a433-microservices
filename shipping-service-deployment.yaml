apiVersion: apps/v1
kind: Deployment  # Deployment shipping service
metadata:
  name: shipping-service  # Nama dari deployment
  labels:
    app: shipping-service  # Label untuk shipping service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-service
  template:
    metadata:
      labels:
        app: shipping-service
        version: v1
      annotations:
        sidecar.istio.io/inject: "true"  # Set sidecar istio
    spec:
      containers:
      - name: shipping-service
        image: ghcr.io/ariellehug/a433-microservices/shipping-service:latest  # Pull image dari github package
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: AMQP_URL  # Untuk connect ke rabbitmq
          value: "amqp://user:MDXBXJZIfeGEQOsJ@rabbitmq.default.svc.cluster.local:5672"