# This is a basic workflow to help you get started with Actions

name: CI Karsajobs

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "karsajobs" ]
  pull_request:
    branches: [ "karsajobs" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Lint Dockerfile dengan hadolint
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3
        with:
          dockerfile: "Dockerfile"

      # Run Unit Test
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.21"

      - name: Run Unit Tests
        run: |
          go test -v -short --count=1 $(go list ./...)

      # Langkah 3: Build & Push Docker Image
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t ghcr.io/ariellehug/a433-microservices/karsajobs:latest .
          docker push ghcr.io/ariellehug/a433-microservices/karsajobs:latest
